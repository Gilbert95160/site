<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin Randonnées</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
    h1 { text-align: center; }
    .rando-form {
      background: #fff; padding: 15px; margin-bottom: 20px;
      border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 5px;
      border-radius: 6px; border: 1px solid #ccc;
    }
    button {
      margin-top: 12px; padding: 10px 15px;
      background: #3498db; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 1em;
    }
    button:hover { background: #2980b9; }
    #listeRandos .rando {
      background: #fff; padding: 12px; margin: 10px 0;
      border-radius: 8px; border: 1px solid #ccc;
    }
    #exportZone {
      white-space: pre; background: #272822; color: #f8f8f2;
      padding: 12px; border-radius: 6px; margin-top: 20px; font-size: 0.9em;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<h1>Admin – Randonnées</h1>

<div class="rando-form">
  <label>Date : <input type="date" id="date"></label>
  <label>Titre : <input type="text" id="titre"></label>
  <label>Lieu de RDV : <input type="text" id="lieu"></label>
  <label>Heure : <input type="time" id="heure"></label>
  <label>Kilométrage : <input type="number" id="km"></label>
  <label>Dénivelé (m) : <input type="number" id="denivele"></label>
  <label>Accompagnateur : <input type="text" id="accompagnateur"></label>
  <label>Latitude : <input type="text" id="lat"></label>
  <label>Longitude : <input type="text" id="lon"></label>
  <label>Description : <textarea id="description"></textarea></label>
  <label>Remarques importantes : <textarea id="remarques"></textarea></label>
  <button onclick="ajouterRando()">Ajouter la randonnée</button>
</div>

<h2>Liste des randonnées</h2>
<div id="listeRandos"></div>

<button onclick="exporterJSON()">📥 Exporter en JSON</button>

<h2>Contenu JSON à coller dans randos.json :</h2>
<pre id="exportZone"></pre>

<script>
  let randos = [];

  function ajouterRando() {
    const r = {
      date: document.getElementById("date").value,
      titre: document.getElementById("titre").value,
      lieu: document.getElementById("lieu").value,
      heure: document.getElementById("heure").value,
      km: document.getElementById("km").value,
      denivele: document.getElementById("denivele").value,
      accompagnateur: document.getElementById("accompagnateur").value,
      lat: document.getElementById("lat").value,
      lon: document.getElementById("lon").value,
      description: document.getElementById("description").value,
      remarques: document.getElementById("remarques").value
    };

    randos.push(r);
    afficherRandos();
    viderFormulaire();
  }

  function afficherRandos() {
    const liste = document.getElementById("listeRandos");
    liste.innerHTML = "";
    randos.forEach((r, i) => {
      const div = document.createElement("div");
      div.className = "rando";
      div.innerHTML = `<b>${r.date || "?"}</b> – ${r.titre || "(sans titre)"} 
        <button onclick="supprimerRando(${i})" style="margin-left:10px; background:#e74c3c;">Supprimer</button>`;
      liste.appendChild(div);
    });
  }

  function supprimerRando(i) {
    randos.splice(i, 1);
    afficherRandos();
  }

  function viderFormulaire() {
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
  }

  function exporterJSON() {
    const zone = document.getElementById("exportZone");
    zone.textContent = JSON.stringify(randos, null, 2);
  }
</script>

</body>
</html>
